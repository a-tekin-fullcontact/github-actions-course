name: 08 - Using Variables

on:
  push:
  workflow_dispatch:
env:
  WORKFLOW_VAR: "I am a workflow var"
  OVERRITTEN: "I will be overritten"

jobs:
  echo:
    env:
      JOB_VAR: "I am job var"
      OVERRITTEN: "I have been overritten at the job level"
    runs-on: ubuntu-latest
    steps:
      - name: Print Env Variables
        env:
          STEP_VAR: "I am a step env var"
          step_var2: "I am another step env var"
        run: |
          echo "Step env var: ${{ env.STEP_VAR }}"
          echo "Step env var2: $step_var2"
          echo "Job env var: $JOB_VAR"
          echo "Job env var: ${{ env.JOB_VAR }}"
          echo "Workflow env var: $WORKFLOW_VAR"
      - name: print step env variables
        env:
          OVERRITTEN: "I have been overritten at the step level"
          run: |
            echo "Step env var: $OVERRITTEN"