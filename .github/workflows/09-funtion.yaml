name: 09 - Using functions

on:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        run: echo "${{ github.event.pull_request.title }}"
      
      - name:
        run: |
          cat << EOF
          ${{ toJSON(github.event.pull_request.labels) }}
          EOF

      - name:
        if: ${{ cancelled() && contains(github.event.pull_request.title, 'fix') }}
        run: echo "I am a bug fix"

      - name: sleep for 20 seconds
        run: sleep 20

      - name: Failing Step
        run: exit 1

      - name: I will be be skipped
        if: ${{ success() }}
        run: echo "I will print if previous steps succeeds"

      - name: I will execute
        if: ${{ failure() }}
        run: echo "I will print if any previous step fails"

      - name: I will execute
        if: ${{ !cancelled() }}
        run: echo "I will always print, except when th workflow is cancelled"

      - name: I will execute when cancelled
        if: ${{ cancelled() }}
        run: echo "I will print if workflow has been cancelled"
